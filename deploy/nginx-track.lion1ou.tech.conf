# track.lion1ou.tech → fanta-monitor (pm2, Fastify :5020)
#
# 部署：
#   scp deploy/nginx-track.lion1ou.tech.conf root@59.110.5.43:/etc/nginx/conf.d/track.lion1ou.tech.conf
#   nginx -t && systemctl reload nginx
# HTTPS（DNS A 记录指向 59.110.5.43 生效后执行一次，certbot 会改写本文件补上 443 块）：
#   certbot --nginx -d track.lion1ou.tech
#
# 服务端 TRUST_PROXY=true 依赖此处透传的 X-Forwarded-For 做 IP 地域解析，勿删。

server {
    listen 80;
    server_name track.lion1ou.tech;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:5020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
